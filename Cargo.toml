[package]
name = "dumahhfiles"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.16.0"
axum = { version = "0.8.9" }
dotenvy = "0.15.7"
lazy_static = "1.5.0"
tokio = { version = "1.52.3", features = ["full"] }
