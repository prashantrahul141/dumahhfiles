[package]
name = "dumahhfiles"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.16.0"
axum = { version = "0.8.9" }
derive = "1.0.0"
dotenvy = "0.15.7"
lazy_static = "1.5.0"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = [
    "process",
    "fs",
    "rt",
    "rt-multi-thread",
] }
tokio-stream = "0.1.18"
tower = { version = "0.5.3", features = ["limit", "buffer"] }
tower-http = { version = "0.6.11", features = ["fs", "limit", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
